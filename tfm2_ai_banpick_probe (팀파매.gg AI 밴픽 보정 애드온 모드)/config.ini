# TFM2 AI Banpick Policy config
# This file is read once when the game/mod loads. Restart the game after editing.
#
# Policy TSV path override:
# - Leave these commented to read ai_champion_policy.tsv from the mod folder.
# - policy_path points to one exact TSV file.
# - policy_dir points to a folder containing policy_file.
#
# policy_path=C:\Path\To\ai_champion_policy.tsv
# policy_dir=C:\Path\To\MetadataExport
policy_file=ai_champion_policy.tsv
candidate_map_file=candidate_map.tsv
#
# Formula:
# final_score = native_score + clamp((overall - overall_neutral) / overall_divisor, min_bias, max_bias)
#
# Smaller divisor = stronger meta influence.
# Larger max/min bias = stronger possible push/punish.
enabled=true
overall_neutral=50
overall_divisor=20
min_bias=-1.5
max_bias=1.5
